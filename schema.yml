components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - confirm_password
      - new_password
      - old_password
    Deposit:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
      required:
      - amount
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    OTPRequest:
      type: object
      properties:
        otp:
          type: string
      required:
      - otp

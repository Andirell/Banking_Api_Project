components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    AdminApproveRequest:
      type: object
      properties:
        loan_id:
          type: integer
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - loan_id
    AdminWalletUpdate:
      type: object
      description: Staff balance correction. Needs a reason and a unique reference.
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          writeOnly: true
          maxLength: 255
        funding_reference:
          type: string
          writeOnly: true
          maxLength: 100
      required:
      - balance
      - funding_reference
      - reason
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - confirm_password
      - new_password
      - old_password
    Deposit:
      type: object
      description: Staff-recorded deposit. The funding reference links it to the real
        payment.
      properties:
        user_id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        funding_reference:
          type: string
          maxLength: 100
        description:
          type: string
      required:
      - amount
      - funding_reference
      - user_id
    EMIPayResponse:
      type: object
      properties:
        emi_id:
          type: integer
        loan_id:
          type: integer
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        transaction_reference:
          type: string
      required:
      - amount
      - emi_id
      - loan_id
      - transaction_reference
    EMIRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        loan:
          type: integer
        due_date:
          type: string
          format: date
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        is_paid:
          type: boolean
      required:
      - due_date
      - id
      - loan
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    KYCSubmit:
      type: object
      properties:
        identity_document:
          type: string
          format: uri
        proof_of_address:
          type: string
          format: uri
      required:
      - identity_document
      - proof_of_address
    LoanApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        duration_months:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        status:
          allOf:
          - $ref: '#/components/schemas/LoanApplicationStatusEnum'
          readOnly: true
        reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - duration_months
      - id
      - status
      - user
    LoanApplicationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    LoanApplyRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        duration_months:
          type: integer
          maximum: 60
          minimum: 1
        reason:
          type: string
      required:
      - amount
      - duration_months
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    OTPRequest:
      type: object
      properties:
        otp:
          type: string
      required:
      - otp
    PatchedAdminWalletUpdate:
      type: object
      description: Staff balance correction. Needs a reason and a unique reference.
      properties:
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          writeOnly: true
          maxLength: 255
        funding_reference:
          type: string
          writeOnly: true
          maxLength: 100
    PatchedUpdateUser:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        phone_number:
          type: string
          nullable: true
          maxLength: 15
        nationality:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    PatchedWallet:
      type: object
      properties:
        user:
          type: string
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        new_password:
          type: string
        confirm_password:
          type: string
      required:
      - confirm_password
      - email
      - new_password
    RoleEnum:
      enum:
      - customer
      - merchant
      - admin
      type: string
      description: |-
        * `customer` - Customer
        * `merchant` - Merchant
        * `admin` - Admin
    SignInRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    SignInResponse:
      type: object
      properties:
        message:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
      required:
      - access_token
      - message
      - refresh_token
    SuspiciousActivity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        transaction:
          type: integer
        risk_score:
          type: number
          format: double
        reason:
          type: string
        flagged_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - flagged_at
      - id
      - reason
      - risk_score
      - transaction
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          format: uuid
          readOnly: true
        sender:
          type: string
          readOnly: true
        receiver:
          type: string
          readOnly: true
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/TransactionStatusEnum'
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - receiver
      - reference
      - sender
      - transaction_type
    TransactionActionResponse:
      type: object
      properties:
        message:
          type: string
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        transaction:
          $ref: '#/components/schemas/Transaction'
      required:
      - balance
      - message
      - transaction
    TransactionStatusEnum:
      enum:
      - pending
      - successful
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `successful` - Successful
        * `failed` - Failed
    TransactionTypeEnum:
      enum:
      - deposit
      - withdraw
      - transfer
      type: string
      description: |-
        * `deposit` - Deposit
        * `withdraw` - Withdraw
        * `transfer` - Transfer
    Transfer:
      type: object
      properties:
        receiver_email:
          type: string
          format: email
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
      required:
      - amount
      - receiver_email
    UpdateUser:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        phone_number:
          type: string
          nullable: true
          maxLength: 15
        nationality:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
      - first_name
      - last_name
    UpdateUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
          additionalProperties: {}
      required:
      - message
      - user
    User:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 15
        nationality:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        bvn:
          type: string
          nullable: true
          maxLength: 11
        password:
          type: string
          writeOnly: true
        confirm_password:
          type: string
          writeOnly: true
      required:
      - confirm_password
      - email
      - first_name
      - last_name
      - password
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone_number:
          type: string
          readOnly: true
          nullable: true
        nationality:
          type: string
          readOnly: true
          nullable: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        address:
          type: string
          readOnly: true
          nullable: true
        bvn:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - address
      - bvn
      - date_of_birth
      - email
      - first_name
      - id
      - is_active
      - last_name
      - nationality
      - phone_number
      - role
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: {}
      required:
      - errors
    VerifyPasswordResetOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
      required:
      - email
      - otp
    VerifySigninOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
      required:
      - email
      - otp
    Wallet:
      type: object
      properties:
        user:
          type: string
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - balance
      - user
    Withdraw:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
      required:
      - amount
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

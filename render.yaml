databases:
  - name: banking-api-db
    plan: free
    databaseName: banking_api
    user: banking_api

services:
  - type: web
    name: banking-api-project
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn my_fintech_app.asgi:application -k uvicorn.workers.UvicornWorker"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banking-api-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
